# SP-21 (#34): build sqlite-vec with its NEON kernels on Apple silicon. The
# sqlite-vec build script does not set this define. Only [env] here: never put
# registry, source or proxy settings in this file.
[env]
CFLAGS_aarch64_apple_darwin = "-DSQLITE_VEC_ENABLE_NEON"
# #45 (CAP-50a, CAP-50b, ADR 0049): the mog-core `local-stt` build links only the vendored,
# hash-pinned sherpa-onnx archive. With this set, sherpa-onnx-sys never downloads; fill the
# folder with `uv run --no-project python scripts/vendor_sherpa_onnx.py`. A value set in the
# environment wins over this one.
SHERPA_ONNX_ARCHIVE_DIR = { value = "vendor/sherpa-onnx", relative = true }
