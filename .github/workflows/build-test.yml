# Build and test every Rust and Node project (#227). Sits beside repo-checks.yml.
# Projects are discovered (scripts/ci_discover.py), so new crates and packages need no change here.
# Test results go to JUnit and then to scripts/req_coverage.py (#182), which fails on unknown IDs.
# Signing, notarization and release builds stay in #227 and run only on tags (not here).
name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.find.outputs.rust }}
      node: ${{ steps.find.outputs.node }}
    steps:
      # Actions are pinned to commit SHAs (AT-37).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: find
        run: python3 scripts/ci_discover.py --github-output

  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv run --no-project --with pytest pytest scripts/tests -q --junitxml=reports/junit-scripts.xml
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-scripts
          path: reports/junit-scripts.xml
          if-no-files-found: ignore

  rust:
    name: Rust ${{ matrix.root }} (${{ matrix.os }})
    needs: discover
    if: needs.discover.outputs.rust != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        root: ${{ fromJSON(needs.discover.outputs.rust) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ matrix.root }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      - id: meta
        run: |
          echo "slug=$(echo '${{ matrix.root }}' | tr '/.' '--')" >> "$GITHUB_OUTPUT"
          if [ -f src-tauri/Cargo.toml ]; then echo "tauri=true" >> "$GITHUB_OUTPUT"; fi
      - name: Tauri system libraries (Linux)
        if: steps.meta.outputs.tauri == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - name: Placeholder frontend dist for the Tauri context macro
        if: steps.meta.outputs.tauri == 'true'
        run: mkdir -p dist && [ -f dist/index.html ] || echo '<!doctype html>' > dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (JUnit)
        run: |
          mkdir -p .config
          printf '[profile.ci]\nfail-fast = false\n[profile.ci.junit]\npath = "junit.xml"\n' > .config/nextest.toml
          cargo nextest run --workspace --all-targets --locked --profile ci
      - name: Doc tests
        run: cargo test --workspace --doc --locked
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-rust-${{ matrix.os }}-${{ steps.meta.outputs.slug }}
          path: ${{ matrix.root }}/target/nextest/ci/junit.xml
          if-no-files-found: ignore

  node:
    name: Node ${{ matrix.root }}
    needs: discover
    if: needs.discover.outputs.node != '[]'
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.discover.outputs.node) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: meta
        run: echo "slug=$(echo '${{ matrix.root }}' | tr '/.' '--')" >> "$GITHUB_OUTPUT"
      - name: pnpm (version from packageManager)
        if: hashFiles(format('{0}/pnpm-lock.yaml', matrix.root)) != ''
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ matrix.root }}/package.json
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install; fi
      - name: Lint and typecheck
        run: |
          if [ -f pnpm-lock.yaml ]; then R="pnpm run --if-present"; else R="npm run --if-present"; fi
          $R lint
          $R typecheck
      - name: Tests (JUnit)
        run: |
          if [ -f pnpm-lock.yaml ]; then R="pnpm run"; X="pnpm exec"; else R="npm run"; X="npx"; fi
          if node -e "process.exit(require('./package.json').scripts?.['test:ci'] ? 0 : 1)"; then $R test:ci
          elif [ -d node_modules/vitest ]; then $X vitest run --reporter=default --reporter=junit --outputFile.junit=reports/junit-ts.xml
          else $R test; fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-node-${{ steps.meta.outputs.slug }}
          path: ${{ matrix.root }}/reports/junit-ts.xml
          if-no-files-found: ignore

  coverage:
    name: Requirement coverage
    needs: [scripts, rust, node]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          path: junit
      - name: scripts/req_coverage.py
        run: |
          mapfile -t files < <(find junit -name '*.xml' | sort)
          echo "JUnit files: ${#files[@]}"
          uv run --no-project scripts/req_coverage.py --requirements research/final-requirements.md \
            --junit "${files[@]}" --out reports/requirements-coverage.md --json reports/requirements-coverage.json
      - if: always()
        run: '[ -f reports/requirements-coverage.md ] && cat reports/requirements-coverage.md >> "$GITHUB_STEP_SUMMARY" || true'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: requirements-coverage
          path: reports/requirements-coverage.*
          if-no-files-found: ignore

  ok:
    name: Build and test ok
    if: always()
    needs: [discover, scripts, rust, node, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -c "import json,os,sys; n=json.loads(os.environ['NEEDS']); bad={k:v['result'] for k,v in n.items() if v['result'] not in ('success','skipped')}; print(bad or 'all ok'); sys.exit(1 if bad else 0)"
