[workspace]
resolver = "2"
members = ["crates/mog-core", "crates/mog-core-ffi", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[workspace.dependencies]
mog-core = { path = "crates/mog-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
# R1 HotkeyService on Windows (#7): the WH_KEYBOARD_LL hook and its message loop.
windows-sys = "0.61"
# NFR-14a / D32 / U1: Tauri 2.12.5 or later. The lockfile check belongs to #169.
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7", features = [] }
# Tests only: the glob matcher that Tauri uses for capability window labels.
glob = "0.3.3"

[profile.release]
codegen-units = 1
lto = true
strip = true
