[workspace]
resolver = "2"
members = ["crates/artifact-verify", "crates/cli-runner", "crates/mog-core", "crates/mog-core-ffi", "src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[workspace.dependencies]
mog-core = { path = "crates/mog-core" }
# R5 CliRunner: resolve, vet and run the Databricks CLI (#16).
cli-runner = { path = "crates/cli-runner" }
# SEC-20b: SHA-256 checks of downloads (#160, PR #257).
artifact-verify = { path = "crates/artifact-verify" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
# R1 HotkeyService on Windows (#7): the WH_KEYBOARD_LL hook and its message loop.
windows-sys = "0.61"
# R16 AgentHost (#112): stop the runtime process group on unix. Already in Cargo.lock.
libc = "0.2"
# NFR-14a / D32 / U1: Tauri 2.12.5 or later. The lockfile check belongs to #169.
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7", features = [] }
# ARC-7: the OS RNG for the per-session loopback secret (#224).
getrandom = "0.3"
# R7 HttpTransport (#364, ADR 0046): blocking HTTPS with rustls only. No default
# features: no native-tls, no HTTP/2, no system-proxy, no cookies, no decompression.
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
# The rustls crypto provider of R7: ring (a plain `cc` build on Windows; aws-lc-rs needs NASM).
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# R2 mic backend on macOS and Windows (#388): the SP-08 pin (#15). Supply-chain review: #160.
cpal = { version = "=0.18.2", default-features = false }
# Tests only: the glob matcher that Tauri uses for capability window labels.
glob = "0.3.3"
# R10 LocalStore (#35). SP-21 (#34): SQLCipher 4 with a static OpenSSL, so the crypto
# provider does not depend on the build machine. sqlite-vec is linked statically.
# Pinned to =0.41.1 (#493): the crates proxy used for local builds does not serve
# 0.42.x yet. Lift this pin (back to 0.42.x) when the proxy serves 0.42.x.
rusqlite = { version = "=0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
sqlite-vec = "0.1.9"
# R10 macOS Keychain for the local store key (MEM-08b). OSX_10_15 gives the data
# protection keychain, the only one that honours kSecAttrAccessible on macOS.
security-framework = { version = "3", features = ["OSX_10_15"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
