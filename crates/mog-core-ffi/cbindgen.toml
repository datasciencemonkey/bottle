# cbindgen config for include/mog_core.h. tests/header.rs checks that the committed header
# matches. Update: BOTTLE_UPDATE_HEADER=1 cargo test -p mog-core-ffi --test header
language = "C"
header = "/* The Bottle mog-core C ABI (R15, NFR-18a..c). Generated by cbindgen from crates/mog-core-ffi/src/lib.rs. Do not edit. */"
include_guard = "MOG_CORE_H"
cpp_compat = true
usize_is_size_t = true
line_endings = "LF"
documentation = true
documentation_style = "c99"
style = "type"

[export]
include = ["MogEventCallback"]
