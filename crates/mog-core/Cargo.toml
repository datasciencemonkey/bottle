[package]
name = "mog-core"
description = "Bottle Rust core: secrets, I/O and the IPC gateway (inside the secret boundary)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
# R9 LakebasePool (v1, optional). Off by default.
lakebase = []
# Test doubles (for example the in-memory key vault) for other crates' tests. Never in a release build.
test-support = []
# R4 local Parakeet STT on sherpa-onnx (#45, CAP-48, CAP-50a, CAP-50b, ADR in docs/adr/0049-local-stt-packaging.md).
# Off by default: it links the vendored sherpa-onnx static libraries, and build.rs refuses the
# build unless SHERPA_ONNX_ARCHIVE_DIR holds the hash-pinned archive (no build-time download).
local-stt = ["dep:sherpa-onnx", "dep:sherpa-onnx-sys", "dep:ureq", "dep:bzip2", "dep:tar"]

[dependencies]
getrandom.workspace = true
reqwest.workspace = true
rustls.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sqlite-vec.workspace = true
# CAP-49c: the pinned SHA-256 checks of the STT model files.
sha2 = "0.10"
# CAP-48: the official sherpa-onnx crate, 2.0.x, static (feature `local-stt`).
sherpa-onnx = { version = "=2.0.1", optional = true, default-features = false, features = ["static"] }
# A direct dependency with `links`, so its build script runs before build.rs checks its output.
sherpa-onnx-sys = { version = "=2.0.1", optional = true, default-features = false, features = ["static"] }
# CAP-49b: the model download client (feature `local-stt`; same crates as the sherpa-onnx build).
ureq = { version = "2.12", optional = true }
bzip2 = { version = "0.4", optional = true }
tar = { version = "0.4", optional = true }

[build-dependencies]
# CAP-50a: build.rs checks the vendored sherpa-onnx archive and the linked lib dir.
sha2 = "0.10"
bzip2 = { version = "0.4", optional = true }
tar = { version = "0.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
# R6 sleep and lock observers (#465): notification blocks.
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSDistributedNotificationCenter", "NSNotification", "NSOperation", "NSString"] }
security-framework.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# R2 mic backend (#388). Only macOS and Windows: Bottle ships on these two.
cpal.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
# AT-42 (#139): the harness memory scan test reads the writable pages of its own process.
windows-sys = { workspace = true, features = [
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }

[[example]]
name = "stt_install"
required-features = ["local-stt"]
