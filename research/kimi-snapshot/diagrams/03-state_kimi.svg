<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1740" viewBox="0 0 1700 1740" role="img" aria-labelledby="state-title state-desc">
  <title id="state-title">MOG lifecycle, interaction states, meeting recording and microphone arbitration</title>
  <desc id="state-desc">The MOG lifecycle moves from Created through Configuring to Ready, with Paused, Degraded and Deleted states. A Ready MOG can listen, transcribe, clean, review a route, return dictation or recall memory, ask Genie, poll, cancel and answer. Meeting recording is an independent explicit workflow with consent, recording and finalizing states. A proposed audio-broker policy gives one MOG microphone ownership, lets the meeting owner reuse its own stream for push-to-talk, rejects other MOGs without stealing audio and finalizes recording on sleep or stop signals.</desc>
  <defs>
    <marker id="state-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#264a73"/>
    </marker>
    <marker id="state-arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#925313"/>
    </marker>
    <style>
      .state-bg { fill: #ffffff; }
      .state-title { font: 700 28px Arial, Helvetica, sans-serif; fill: #14243a; }
      .state-subtitle { font: 16px Arial, Helvetica, sans-serif; fill: #40536b; }
      .state-heading { font: 700 19px Arial, Helvetica, sans-serif; fill: #14243a; }
      .state-region { fill: #fafcff; stroke: #9aabbd; stroke-width: 1.7; rx: 16; }
      .state-box { fill: #e8f3fb; stroke: #2c648c; stroke-width: 2; rx: 12; }
      .state-active { fill: #eaf6ec; stroke: #39733d; stroke-width: 2; rx: 12; }
      .state-warning { fill: #fff8e8; stroke: #9a6716; stroke-width: 2; rx: 12; }
      .state-terminal { fill: #f0eff5; stroke: #65567e; stroke-width: 2; rx: 12; }
      .state-decision { fill: #fff1ec; stroke: #a44325; stroke-width: 2; stroke-dasharray: 7 5; rx: 12; }
      .state-label { font: 700 15px Arial, Helvetica, sans-serif; fill: #14243a; text-anchor: middle; }
      .state-text { font: 13px Arial, Helvetica, sans-serif; fill: #263c56; }
      .state-small { font: 12px Arial, Helvetica, sans-serif; fill: #40536b; }
      .state-center { text-anchor: middle; }
      .state-flow { fill: none; stroke: #264a73; stroke-width: 2.3; marker-end: url(#state-arrow); }
      .state-alt { fill: none; stroke: #925313; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#state-arrow-alt); }
      .state-table { fill: #ffffff; stroke: #72869b; stroke-width: 1.5; }
      .state-table-head { fill: #e8f3fb; stroke: #72869b; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="state-bg" x="0" y="0" width="1700" height="1740"/>
  <text class="state-title" x="40" y="48">MOG state model and shared-audio rules</text>
  <text class="state-subtitle" x="40" y="78">Interaction and meeting recording are parallel workflows. The Audio Broker prevents hidden microphone handoff.</text>

  <rect class="state-region" x="35" y="105" width="1630" height="230"/>
  <text class="state-heading" x="60" y="138">A. MOG LIFECYCLE</text>

  <rect class="state-box" x="65" y="175" width="180" height="86"/>
  <text class="state-label" x="155" y="209">Created</text>
  <text class="state-small state-center" x="155" y="235">Name + visual identity</text>

  <rect class="state-box" x="295" y="175" width="200" height="86"/>
  <text class="state-label" x="395" y="205">Configuring</text>
  <text class="state-small state-center" x="395" y="229">Profile + backend + memory</text>
  <text class="state-small state-center" x="395" y="248">Hotkey + capture policy</text>

  <rect class="state-active" x="550" y="175" width="180" height="86"/>
  <text class="state-label" x="640" y="209">Ready</text>
  <text class="state-small state-center" x="640" y="235">Available; not recording</text>

  <rect class="state-warning" x="790" y="175" width="180" height="86"/>
  <text class="state-label" x="880" y="209">Paused</text>
  <text class="state-small state-center" x="880" y="235">Pause stops all capture</text>

  <rect class="state-warning" x="1030" y="175" width="200" height="86"/>
  <text class="state-label" x="1130" y="205">Degraded</text>
  <text class="state-small state-center" x="1130" y="229">Local dictation may remain</text>
  <text class="state-small state-center" x="1130" y="248">Cloud failure is visible</text>

  <rect class="state-terminal" x="1400" y="175" width="180" height="86"/>
  <text class="state-label" x="1490" y="209">Deleted</text>
  <text class="state-small state-center" x="1490" y="235">No capture or network</text>

  <path class="state-flow" d="M245 218 H295"/>
  <path class="state-flow" d="M495 218 H550"/>
  <path class="state-flow" d="M730 200 H790"/>
  <path class="state-flow" d="M790 245 H730"/>
  <path class="state-flow" d="M730 278 H1130 V261"/>
  <path class="state-flow" d="M1030 218 H730" transform="translate(0 42)"/>
  <path class="state-alt" d="M1230 200 H1400"/>
  <text class="state-small" x="756" y="190">pause</text>
  <text class="state-small" x="742" y="238">resume</text>
  <text class="state-small" x="1260" y="190">delete from any state</text>
  <text class="state-text" x="65" y="302">Delete stops local capture and work. Request supported remote cancellation and Lakebase deletion separately.</text>

  <rect class="state-region" x="35" y="355" width="1630" height="525"/>
  <text class="state-heading" x="60" y="389">B. INTERACTION STATE — ONE MOG</text>
  <text class="state-text" x="60" y="417">Esc cancels listening or active Genie work. Errors enter Degraded. A raw transcript is never replaced by a fabricated answer.</text>

  <rect class="state-active" x="55" y="480" width="170" height="100"/>
  <text class="state-label" x="140" y="514">Idle</text>
  <text class="state-small state-center" x="140" y="540">Ready for hotkey</text>
  <text class="state-small state-center" x="140" y="560">No microphone lease</text>

  <rect class="state-active" x="260" y="480" width="170" height="100"/>
  <text class="state-label" x="345" y="510">Listening</text>
  <text class="state-small state-center" x="345" y="536">Hotkey down + lease</text>
  <text class="state-small state-center" x="345" y="556">Visible indicator</text>

  <rect class="state-box" x="465" y="480" width="170" height="100"/>
  <text class="state-label" x="550" y="510">Transcribing</text>
  <text class="state-small state-center" x="550" y="536">Key up / VAD segment</text>
  <text class="state-small state-center" x="550" y="556">Local or hosted STT</text>

  <rect class="state-box" x="670" y="480" width="170" height="100"/>
  <text class="state-label" x="755" y="510">Cleaning</text>
  <text class="state-small state-center" x="755" y="536">Pre-pass + SLM</text>
  <text class="state-small state-center" x="755" y="556">Raw fallback on timeout</text>

  <rect class="state-decision" x="875" y="480" width="180" height="100"/>
  <text class="state-label" x="965" y="506">Explicit Route</text>
  <text class="state-small state-center" x="965" y="532">Dictate / Ask Genie / Save local</text>
  <text class="state-small state-center" x="965" y="552">Ambiguous: no network call</text>
  <text class="state-small state-center" x="965" y="571">Raw transcript restore available</text>

  <rect class="state-box" x="1090" y="480" width="170" height="100"/>
  <text class="state-label" x="1175" y="510">Recalling</text>
  <text class="state-small state-center" x="1175" y="536">Scoped local-first memory</text>
  <text class="state-small state-center" x="1175" y="556">Bounded recall deadline</text>

  <rect class="state-box" x="1295" y="480" width="170" height="100"/>
  <text class="state-label" x="1380" y="510">Asking Genie</text>
  <text class="state-small state-center" x="1380" y="536">genie_ask</text>
  <text class="state-small state-center" x="1380" y="556">Persist conversation IDs</text>

  <path class="state-flow" d="M225 530 H260"/>
  <path class="state-flow" d="M430 530 H465"/>
  <path class="state-flow" d="M635 530 H670"/>
  <path class="state-flow" d="M840 530 H875"/>
  <path class="state-flow" d="M1055 530 H1090"/>
  <path class="state-flow" d="M1260 530 H1295"/>
  <path class="state-alt" d="M345 480 V450 H140 V480"/>
  <text class="state-small" x="160" y="442">Esc: cancel and release the push-to-talk lease</text>

  <rect class="state-terminal" x="875" y="680" width="180" height="100"/>
  <text class="state-label" x="965" y="714">Dictation Returned</text>
  <text class="state-small state-center" x="965" y="740">Copy or safe paste</text>
  <text class="state-small state-center" x="965" y="760">No Genie call</text>

  <rect class="state-box" x="1295" y="680" width="170" height="100"/>
  <text class="state-label" x="1380" y="710">Polling</text>
  <text class="state-small state-center" x="1380" y="736">Sequential bounded poll</text>
  <text class="state-small state-center" x="1380" y="756">Progress is visible</text>

  <rect class="state-active" x="1090" y="680" width="170" height="100"/>
  <text class="state-label" x="1175" y="710">Answering</text>
  <text class="state-small state-center" x="1175" y="736">Blurb + key numbers</text>
  <text class="state-small state-center" x="1175" y="756">Deep link + memory event</text>

  <rect class="state-warning" x="1500" y="680" width="150" height="100"/>
  <text class="state-label" x="1575" y="710">Cancelling</text>
  <text class="state-small state-center" x="1575" y="736">genie_cancel_response</text>
  <text class="state-small state-center" x="1575" y="756">Then release work</text>

  <rect class="state-warning" x="465" y="680" width="170" height="100"/>
  <text class="state-label" x="550" y="710">Degraded</text>
  <text class="state-small state-center" x="550" y="736">Actionable error state</text>
  <text class="state-small state-center" x="550" y="756">Retry / edit / local only</text>

  <path class="state-flow" d="M965 580 V680"/>
  <text class="state-small" x="977" y="626">dictation</text>
  <path class="state-flow" d="M1380 580 V680"/>
  <text class="state-small" x="1392" y="626">response IDs</text>
  <path class="state-flow" d="M1295 730 H1260"/>
  <text class="state-small" x="1268" y="713" text-anchor="end">completed</text>
  <path class="state-alt" d="M1465 730 H1500"/>
  <text class="state-small" x="1482" y="704" text-anchor="middle">stop</text>
  <path class="state-flow" d="M1465 680 V635 H1490 V680" transform="translate(-25 0)"/>
  <text class="state-small" x="1490" y="626" text-anchor="end">in_progress: wait, then poll again</text>

  <path class="state-flow" d="M965 780 V815 H140 V580"/>
  <path class="state-flow" d="M1175 780 V840 H160 V580"/>
  <path class="state-flow" d="M1575 780 V860 H180 V580"/>
  <path class="state-flow" d="M550 780 V795 H120 V580"/>
  <text class="state-small" x="195" y="806">return to Idle; memory synchronization is asynchronous</text>
  <text class="state-small" x="195" y="852">cancel requested; outcome can stay uncertain</text>

  <rect class="state-region" x="35" y="900" width="1630" height="285"/>
  <text class="state-heading" x="60" y="934">C. MEETING RECORDER — INDEPENDENT EXPLICIT WORKFLOW</text>

  <rect class="state-active" x="65" y="970" width="175" height="90"/>
  <text class="state-label" x="152" y="1004">Meeting Idle</text>
  <text class="state-small state-center" x="152" y="1030">No meeting capture</text>

  <rect class="state-warning" x="295" y="970" width="210" height="90"/>
  <text class="state-label" x="400" y="1000">Consent + Preflight</text>
  <text class="state-small state-center" x="400" y="1026">User start + visible notice</text>
  <text class="state-small state-center" x="400" y="1046">Disk, devices and policy checked</text>

  <rect class="state-active" x="560" y="970" width="265" height="90"/>
  <text class="state-label" x="692" y="996">Recording</text>
  <text class="state-small state-center" x="692" y="1022">Persistent indicator + separate tracks</text>
  <text class="state-small state-center" x="692" y="1042">Crash-safe chunks + live transcription</text>

  <rect class="state-box" x="880" y="970" width="200" height="90"/>
  <text class="state-label" x="980" y="1000">Finalizing</text>
  <text class="state-small state-center" x="980" y="1026">Flush journal + finish ASR</text>
  <text class="state-small state-center" x="980" y="1046">Close index + release leases</text>

  <rect class="state-terminal" x="1135" y="970" width="200" height="90"/>
  <text class="state-label" x="1235" y="1000">Meeting Available</text>
  <text class="state-small state-center" x="1235" y="1026">Transcript + provenance</text>
  <text class="state-small state-center" x="1235" y="1046">Memory policy still applies</text>

  <rect class="state-warning" x="1390" y="970" width="220" height="90"/>
  <text class="state-label" x="1500" y="1000">Recovery Required</text>
  <text class="state-small state-center" x="1500" y="1026">Crash / full disk / device loss</text>
  <text class="state-small state-center" x="1500" y="1046">Preserve readable segments</text>

  <path class="state-flow" d="M240 1015 H295"/>
  <path class="state-flow" d="M505 1015 H560"/>
  <path class="state-flow" d="M825 1015 H880"/>
  <path class="state-flow" d="M1080 1015 H1135"/>
  <path class="state-alt" d="M1335 1015 H1390"/>
  <path class="state-flow" d="M1235 1060 V1090 H152 V1060"/>

  <text class="state-text" x="65" y="1115">Stop: manual; trusted mic release + grace; 15-minute silence + countdown; sleep; low disk; 4 hours.</text>
  <text class="state-text" x="65" y="1142">Review only: calendar end and 90 minutes. They do not stop an active meeting. Indicator failure stops capture.</text>
  <text class="state-small" x="65" y="1166">On restart, recover complete segments before starting a new meeting. Diarization labels “You” and “Others” are track labels, not verified identities.</text>

  <rect class="state-region" x="35" y="1205" width="1630" height="500"/>
  <text class="state-heading" x="60" y="1239">D. MULTI-MOG MICROPHONE ARBITRATION — APPROVED V1 BASELINE</text>
  <text class="state-text" x="60" y="1267">One Audio Broker owns the device. A second MOG never takes audio silently. System audio has a separate lease and one meeting owner.</text>

  <rect class="state-table-head" x="60" y="1295" width="450" height="48"/>
  <rect class="state-table-head" x="510" y="1295" width="570" height="48"/>
  <rect class="state-table-head" x="1080" y="1295" width="555" height="48"/>
  <text class="state-label" x="285" y="1325">Request / event</text>
  <text class="state-label" x="795" y="1325">Broker decision</text>
  <text class="state-label" x="1357" y="1325">Required user-visible result</text>

  <g>
    <rect class="state-table" x="60" y="1343" width="450" height="43"/><rect class="state-table" x="510" y="1343" width="570" height="43"/><rect class="state-table" x="1080" y="1343" width="555" height="43"/>
    <text class="state-text" x="75" y="1370">MOG A push-to-talk; microphone free</text><text class="state-text" x="525" y="1370">Grant PTT lease to A. Open microphone once.</text><text class="state-text" x="1095" y="1370">MOG A shows Listening and its target workspace.</text>

    <rect class="state-table" x="60" y="1386" width="450" height="43"/><rect class="state-table" x="510" y="1386" width="570" height="43"/><rect class="state-table" x="1080" y="1386" width="555" height="43"/>
    <text class="state-text" x="75" y="1413">MOG B push-to-talk; A owns PTT</text><text class="state-text" x="525" y="1413">Reject B. Do not interrupt A. Queue only by explicit policy.</text><text class="state-text" x="1095" y="1413">MOG B says “MOG A is listening.” B captures nothing.</text>

    <rect class="state-table" x="60" y="1429" width="450" height="43"/><rect class="state-table" x="510" y="1429" width="570" height="43"/><rect class="state-table" x="1080" y="1429" width="555" height="43"/>
    <text class="state-text" x="75" y="1456">MOG A starts meeting; microphone free</text><text class="state-text" x="525" y="1456">Grant Meeting lease to A after consent and preflight.</text><text class="state-text" x="1095" y="1456">Persistent Recording indicator appears until finalized.</text>

    <rect class="state-table" x="60" y="1472" width="450" height="54"/><rect class="state-table" x="510" y="1472" width="570" height="54"/><rect class="state-table" x="1080" y="1472" width="555" height="54"/>
    <text class="state-text" x="75" y="1496">MOG A push-to-talk during its own meeting</text><text class="state-text" x="525" y="1496">Share A’s existing stream through the broker. Keep separate</text><text class="state-text" x="1095" y="1496">MOG A shows both Recording and Listening. The PTT segment</text>
    <text class="state-small" x="525" y="1516">PTT and meeting segment buffers. Do not reopen the device.</text><text class="state-small" x="1095" y="1516">is marked in the meeting timeline; no duplicate audio is stored.</text>

    <rect class="state-table" x="60" y="1526" width="450" height="43"/><rect class="state-table" x="510" y="1526" width="570" height="43"/><rect class="state-table" x="1080" y="1526" width="555" height="43"/>
    <text class="state-text" x="75" y="1553">MOG B requests PTT or meeting during A meeting</text><text class="state-text" x="525" y="1553">Reject B. Do not join, mix or steal A’s audio.</text><text class="state-text" x="1095" y="1553">MOG B names the owner and offers Retry or Switch MOG.</text>

    <rect class="state-table" x="60" y="1569" width="450" height="43"/><rect class="state-table" x="510" y="1569" width="570" height="43"/><rect class="state-table" x="1080" y="1569" width="555" height="43"/>
    <text class="state-text" x="75" y="1596">A releases PTT / presses Esc</text><text class="state-text" x="525" y="1596">Release only the PTT consumer. Keep A meeting lease alive.</text><text class="state-text" x="1095" y="1596">Listening ends. Recording indicator remains if meeting runs.</text>

    <rect class="state-table" x="60" y="1612" width="450" height="43"/><rect class="state-table" x="510" y="1612" width="570" height="43"/><rect class="state-table" x="1080" y="1612" width="555" height="43"/>
    <text class="state-text" x="75" y="1639">Sleep, stop signal, delete or hotkey ambiguity</text><text class="state-text" x="525" y="1639">Cancel PTT. Finalize meeting. Ambiguous target captures nothing.</text><text class="state-text" x="1095" y="1639">Show final status or a MOG chooser before any new capture.</text>
  </g>

  <text class="state-small" x="60" y="1685">Approved v1 rule: separate PTT and meeting buffers reuse one owned stream. Mark the PTT interval. Open no second capture session.</text>
</svg>
