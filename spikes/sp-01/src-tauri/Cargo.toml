[package]
name = "sp01-rive-transparent"
version = "0.0.0"
edition = "2021"
publish = false
description = "Throwaway spike SP-01: Rive in a transparent non-activating Tauri window"

# Standalone crate: not part of any workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSView", "NSColor", "NSGraphics", "NSRunningApplication", "NSApplication", "NSEvent", "NSTrackingArea", "NSPanel", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSError", "NSGeometry"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "block2", "objc2-app-kit"] }
block2 = "0.6"
