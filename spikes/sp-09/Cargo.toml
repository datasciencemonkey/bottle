[package]
name = "sp09"
version = "0.1.0"
edition = "2024"
publish = false
description = "SP-09 (#29): thin JSON-RPC-over-HTTP MCP client for Genie One MCP with token rotation"

# Standalone spike crate: not part of any workspace.
[workspace]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "time"] }
url = "2.5.8"

[[bin]]
name = "live"
path = "src/bin/live.rs"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
