[package]
name = "bottle"
description = "Bottle desktop app: the Tauri v2 shell that links mog-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (Tauri template rule).
name = "bottle_lib"
crate-type = ["rlib"]

[build-dependencies]
mog-core.workspace = true
tauri-build.workspace = true

[dependencies]
mog-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# ARC-4: no tauri-plugin-http, -shell, -fs or any network plugin. A test checks this file.
tauri.workspace = true

[dev-dependencies]
# ARC-4 test: match window labels the way Tauri matches capability globs.
glob.workspace = true
# `tauri::test::mock_app` for the R11 host tests. The `test` feature adds no crate.
tauri = { workspace = true, features = ["test"] }

# MOG-02 AppKit read-back: AppKit windows are made on the main thread, so this test has its own main.
[[test]]
name = "macos_panel_appkit"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSGraphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
