[package]
name = "bottle"
description = "Bottle desktop app: the Tauri v2 shell that links mog-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (Tauri template rule).
name = "bottle_lib"
crate-type = ["rlib"]

[features]
default = []
# #413 (ADR 0049): the app's local Parakeet STT. It turns on `mog-core/local-stt`, so the PTT
# host loads the installed model with `stt_local::ParakeetLoader` instead of `NoModelLoader`.
# Off by default: the build needs the vendored, hash-pinned sherpa-onnx archive in
# SHERPA_ONNX_ARCHIVE_DIR (`scripts/vendor_sherpa_onnx.py`), and App CI has no such step yet.
# TODO(#534): CI and the release build turn it on after the vendored archive fetch (with #414).
local-stt = ["mog-core/local-stt"]

[build-dependencies]
mog-core.workspace = true
tauri-build.workspace = true

[dependencies]
mog-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# ARC-4: no tauri-plugin-http, -shell, -fs or any network plugin. A test checks this file.
tauri.workspace = true

# MOG-02 / MOG-01c: the NSPanel class swap and the drag monitor. tao and wry already use these
# versions, so they add no crate to Cargo.lock (ADR 0009). No git dependency (#160).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSColor", "NSEvent", "NSGraphics", "NSPanel", "NSResponder", "NSWindow"] }

[dev-dependencies]
# ARC-4 test: match window labels the way Tauri matches capability globs.
glob.workspace = true
# `tauri::test::mock_app` for the R11 host tests. The `test` feature adds no crate.
tauri = { workspace = true, features = ["test"] }

# MOG-02 AppKit read-back: AppKit windows are made on the main thread, so this test has its own main.
[[test]]
name = "macos_panel_appkit"
harness = false

# NFR-13a / #381: read the manifest resource of a Windows test executable.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration"] }
